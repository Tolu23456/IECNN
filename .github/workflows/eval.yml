# Runner-side checkpoint evaluation (Tolu's rule: ALL compute on GitHub,
# including inference/eval — never on a dev box). Downloads a training
# checkpoint artifact, re-scores its BEST point on the FULL validation text
# at the tau annealed to that step, records per-pass bpc + weight entropy,
# and commits the JSON to results/. Also exercises the vocab fingerprint
# guard (loud failure on vocab/model mismatch).
name: eval
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Checkpoint artifact name (e.g. e1_weights_passes_pilot.yaml-seeds-0-pilot)"
        required: true
      vocab:
        description: "Vocab file the checkpoint was trained with"
        default: "UBM/vocab_v1.json"
      corpus_config:
        description: "Config for rebuilding data/*.txt (split must match training)"
        default: "e1_weights_passes.yaml"

permissions:
  contents: write
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyTorch (CPU) + requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-torch.txt
          python -m pip install -r requirements.txt

      # ---- corpus: rebuild data/*.txt (same deterministic split as training) --
      - name: Prepare corpus
        env:
          CONFIG: ${{ github.event.inputs.corpus_config }}
        run: |
          set -euo pipefail
          if [ -f data/train.txt ] && [ -f data/val.txt ]; then echo "present"; exit 0; fi
          python - << 'PYEOF'
          from config import load_config
          from data.prepare import prepare_all
          cfg = load_config("configs/" + __import__("os").environ["CONFIG"])
          info = prepare_all(cfg)
          for name, d in info["parts"].items():
              print(name, d["chars"], d["sha256"][:16])
          PYEOF

      # ---- download + extract the checkpoint artifact ------------------------
      - name: Download checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ github.event.inputs.artifact }}
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -o /tmp/artifacts.json
          python - << 'PYEOF'
          import json, os, sys
          d = json.load(open("/tmp/artifacts.json"))
          name = os.environ["ARTIFACT"]
          arts = d.get("artifacts", [])
          print("total artifacts listed:", len(arts))
          for a in arts[:5]:
              print("  sample:", a["name"], "expired" if a["expired"] else "ok", a["created_at"])
          cands = [a for a in arts if a["name"] == name and not a["expired"]]
          if not cands:
              print("ARTIFACT_NOT_FOUND:" + name, file=sys.stderr)
              sys.exit(1)
          newest = max(cands, key=lambda a: (a["created_at"], a["id"]))
          open("/tmp/art_id", "w").write(str(newest["id"]))
          print("found artifact", newest["id"], "created", newest["created_at"])
          PYEOF
          ART_ID=$(cat /tmp/art_id)
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" \
            -o /tmp/artifact.zip
          unzip -qo /tmp/artifact.zip "checkpoints/*" -d .

      - name: Re-score best point (full val, best-step tau)
        run: |
          set -euo pipefail
          CKPT_DIR=$(find checkpoints -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "ckpt dir: $CKPT_DIR"
          RUN=$(basename "$CKPT_DIR")
          python scripts/eval_checkpoint.py \
            --ckpt-dir "$CKPT_DIR" \
            --vocab "${{ github.event.inputs.vocab }}" \
            --out "results/eval_${RUN}.json"
          cat "results/eval_${RUN}.json"

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval_${{ github.event.inputs.artifact }}
          path: results/eval_*.json

      - name: Commit results when finished
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add results/eval_*.json
          git commit -m "results: checkpoint re-score [artifact ${{ github.event.inputs.artifact }}]" || echo "nothing to commit"
          git push
