# Runner-side text generation from a trained checkpoint ("playground" backend;
# Tolu, 2026-11-14). Inference only; torch stays on GitHub Actions. Downloads
# a checkpoint artifact, encodes the prompt with the run's own vocabulary,
# samples a continuation (temperature/top-k, seeded), and commits
# results/generation/<slug>.json which the Explorer's Playground page fetches.
#
# Corpus verified against the training run's split_info (2026-11-13 lesson).
name: generate
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt text to continue"
        required: true
      artifact:
        description: "Checkpoint artifact name (e.g. e1_weights_passes_pilot.yaml-seeds-0-pilot)"
        default: "e1_weights_passes_pilot.yaml-seeds-0-pilot"
      vocab:
        default: "UBM/vocab_v1.json"
      corpus_config:
        description: "MUST be a *_pilot.yaml (data.corpus: big)"
        default: "e1_weights_passes_pilot.yaml"
      max_new_tokens:
        default: "200"
      temperature:
        default: "0.8"
      top_k:
        default: "40"
      seed:
        default: "0"
      expert_sampling:
        description: "IECNN only: expert-of-the-moment decoding (sample dot by trust, then token from that dot)"
        default: "false"

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyTorch (CPU) + requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-torch.txt
          python -m pip install -r requirements.txt

      - name: Download checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ github.event.inputs.artifact }}
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -o /tmp/artifacts.json
          python - << 'PYEOF'
          import json, os, sys
          d = json.load(open("/tmp/artifacts.json"))
          name = os.environ["ARTIFACT"]
          arts = d.get("artifacts", [])
          cands = [a for a in arts if a["name"] == name and not a["expired"]]
          if not cands:
              print("ARTIFACT_NOT_FOUND:" + name, file=sys.stderr)
              sys.exit(1)
          newest = max(cands, key=lambda a: (a["created_at"], a["id"]))
          open("/tmp/art_id", "w").write(str(newest["id"]))
          print("found artifact", newest["id"])
          PYEOF
          ART_ID=$(cat /tmp/art_id)
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" \
            -o /tmp/artifact.zip

      - name: Prepare corpus
        if: ${{ !hashFiles('data/val.txt') }}
        env:
          CONFIG: ${{ github.event.inputs.corpus_config }}
        run: |
          set -euo pipefail
          python - << 'PYEOF'
          import os
          from config import load_config
          from data.prepare import prepare_all
          cfg = load_config("configs/" + os.environ["CONFIG"])
          info = prepare_all(cfg)
          for name, d in info["parts"].items():
              print(name, d["chars"], d["sha256"][:16])
          PYEOF

      - name: Verify corpus matches the training run
        run: |
          set -euo pipefail
          python - << 'PYEOF'
          import hashlib, json, sys, zipfile
          val = open("data/val.txt", encoding="utf-8").read()
          if len(val) < 150_000:
              sys.exit(f"CORPUS GUARD FAILED: val.txt has {len(val)} chars — "
                       "this is the v0 Shakespeare split, not corpus v1. Pass a "
                       "*_pilot.yaml (data.corpus: big) as corpus_config.")
          have = hashlib.sha256(val.encode("utf-8")).hexdigest()
          with zipfile.ZipFile("/tmp/artifact.zip") as z:
              names = z.namelist()
              ref = json.loads(z.read("data/split_info.json")) \
                    ["parts"]["val"]["sha256"] if "data/split_info.json" in names else None
          if ref is not None:
              print(f"val chars={len(val)} sha={have[:16]} expected={ref[:16]}")
              if have != ref:
                  sys.exit("CORPUS MISMATCH vs the training run's split_info.")
          print("corpus verified")
          PYEOF

      - name: Extract checkpoint
        run: unzip -qo /tmp/artifact.zip "checkpoints/*" -d .

      - name: Generate
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          MAXNEW: ${{ github.event.inputs.max_new_tokens }}
          TEMP: ${{ github.event.inputs.temperature }}
          TOPK: ${{ github.event.inputs.top_k }}
          SEED: ${{ github.event.inputs.seed }}
          VOCAB: ${{ github.event.inputs.vocab }}
          EXPERT: ${{ github.event.inputs.expert_sampling }}
          ARTIFACT: ${{ github.event.inputs.artifact }}
        run: |
          set -euo pipefail
          # checkpoint dir comes from what the artifact actually contains —
          # never assume the run name (hardcoding sent the wrong run once
          # already in this project's history)
          CKPT_DIR=$(ls -d checkpoints/*/ | head -1)
          echo "using checkpoint dir: $CKPT_DIR"
          SLUG="gen-$(date -u +%Y%m%d-%H%M%S)"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          printf '%s' "$PROMPT" > /tmp/prompt.txt
          EXPERT_FLAG=""
          if [ "$EXPERT" = "true" ]; then EXPERT_FLAG="--expert-sampling"; fi
          CFG="${ARTIFACT%%-seeds-*}.yaml"   # fallback for timeout-killed chunks
          python scripts/generate.py \
            --ckpt-dir "$CKPT_DIR" \
            --vocab "$VOCAB" \
            --config-fallback "configs/$CFG" \
            --prompt-file /tmp/prompt.txt \
            --max-new-tokens "$MAXNEW" \
            --temperature "$TEMP" \
            --top-k "$TOPK" \
            --seed "$SEED" \
            $EXPERT_FLAG \
            --out "results/generation/$SLUG.json"

      - name: Commit generation
        run: |
          set -euo pipefail
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results/generation/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "generation [$SLUG] from ${{ github.event.inputs.artifact }}"
          git -c rebase.autoStash=true pull --rebase origin main || true
          git push

      - name: Upload generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: generation-${{ env.SLUG }}
          path: results/generation/
          retention-days: 30

      - name: Print the generated text
        run: |
          python - << 'PYEOF'
          import glob, json
          f = sorted(glob.glob('results/generation/*.json'))[-1]
          print(json.load(open(f))['generated'])
          PYEOF
