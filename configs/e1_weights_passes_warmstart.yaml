# E1 to-plateau (Tolu, 2026-11-13): same protocol as the E0 warm-start
# anchor — patience-only early stop (NO wall cap), constant LR after warmup
# 500, one shared schedule across rungs. This is the run whose plateau makes
# the E0-vs-E1 ladder comparison decision-grade (the aux lambdas' worth at
# convergence, not just at the 2 h pilot stop).
#
# Honest pilot reference (corpus v1, verified 2026-11-13): E1 full-val
# 3.20294 @ step 540, tau 0.95426, train slice 3.28431.
base: e1_weights_passes.yaml
name: e1_weights_passes_warmstart
data:
  corpus: big
ubm:
  vocab_file: UBM/vocab_v1.json
consensus:
  tau_warmup: 480            # same as the E0 warm-start anchor
training:
  lr_schedule: constant
  warmup_steps: 500
  steps: 50000                 # ceiling only; patience governs the stop
  eval_chars: 100000
  eval_every: 240
  checkpoint_every: 240
  early_stop:
    patience_evals: 6
    min_improvement: 0.005
    wall_hours: 0.0            # NO wall cap: train to a true plateau
