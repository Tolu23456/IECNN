# E1 + vocab_v3 @4096, to-plateau (2026-11-14): the vocab-scaling pilot
# curves were ALL still descending at their wall caps (512: 3.20294 @540,
# 2048: 2.59667 @780, 4096: 2.44863 @900 full-val) — so the honest next
# question is where the best vocab's curve actually plateaus. Same warm
# protocol as the E0/E1 anchors (patience-only, constant LR after warmup,
# tau_warmup 480).
#
# batch_size 8: the per-pass per-dot log_pi block [B,T,N,V] scales with V
# (4096 = 8x the 512 vocab); batch 8 keeps retention in the runner's ~7 GB
# class, matching the vocab3 pilot.
base: e1_weights_passes.yaml
name: e1_weights_passes_vocab3_warmstart
data:
  corpus: big
ubm:
  vocab_file: UBM/vocab_v3.json
consensus:
  tau_warmup: 480
training:
  batch_size: 8
  lr_schedule: constant
  warmup_steps: 500
  steps: 50000                 # ceiling only; patience governs the stop
  eval_chars: 100000
  eval_every: 120
  checkpoint_every: 120
  early_stop:
    patience_evals: 6
    min_improvement: 0.005
    wall_hours: 0.0            # NO wall cap: train to a true plateau
