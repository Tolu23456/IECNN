# Rung E0: plain ensemble. One pass, one region, uniform weights, main loss only.
# pooling: mixture so the consensus is the arithmetic mean of the dots'
# distributions — exactly a "plain ensemble" (spec 08 B2).
base: base.yaml
name: e0_plain_ensemble
model:
  n_passes: 1
  n_regions: 1
  use_weights: false
  use_cross_region: false
  use_messages: false
  pooling: mixture

training:

  # regularization parity (Tolu, 2026-11-02): identical values at every rung
  weight_decay: 0.01
  dot_dropout: 0.0
  message_dropout: 0.2
