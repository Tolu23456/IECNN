# Rung E2: adds 4 regions as stages and cross-region competition.
base: e1_weights_passes.yaml
name: e2_regions
model:
  n_regions: 4
  use_cross_region: true
training:

  # regularization parity (Tolu, 2026-11-02): identical values at every rung
  weight_decay: 0.01
  dot_dropout: 0.0
  message_dropout: 0.2
  lambda_r: 0.3
