# Rung E1: adds learned weights and 3 passes (one region).
# Agent: record in DECISIONS.md which auxiliary losses are on at each rung.
base: e0_plain_ensemble.yaml
name: e1_weights_passes
model:
  n_passes: 3
  use_weights: true
  pooling: log_linear      # explicit: do NOT inherit E0's mixture pooling
training:

  # regularization parity (Tolu, 2026-11-02): identical values at every rung
  weight_decay: 0.01
  dot_dropout: 0.0
  message_dropout: 0.2
  lambda_d: 0.1
  lambda_k: 0.05
  lambda_w: 0.05
